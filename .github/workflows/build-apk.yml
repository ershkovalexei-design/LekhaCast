name: Build Lekha Cast APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout branding repository
        uses: actions/checkout@v4

      - name: Checkout AirPlay receiver source
        uses: actions/checkout@v4
        with:
          repository: jqssun/android-airplay-server
          ref: main
          path: airplay-src
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android build packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-36" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Apply Lekha Cast branding
        run: |
          python3 - <<'PY'
          from pathlib import Path

          strings = Path("airplay-src/app/src/main/res/values/strings.xml")
          content = strings.read_text(encoding="utf-8")
          if "AirPlay Server" not in content:
              raise SystemExit("Could not find expected app name in strings.xml")
          strings.write_text(content.replace("AirPlay Server", "Лёха Cast"), encoding="utf-8")

          prefs = Path("airplay-src/app/src/main/kotlin/io/github/jqssun/airplay/Prefs.kt")
          content = prefs.read_text(encoding="utf-8")
          if '"Android AirPlay"' not in content:
              raise SystemExit("Could not find expected default receiver name in Prefs.kt")
          prefs.write_text(content.replace('"Android AirPlay"', '"Лёха TV"'), encoding="utf-8")

          # A dropped encoded access unit can invalidate subsequent inter-frame
          # references. Reset the decoder and wait for the next keyframe instead
          # of continuing with a potentially corrupted reference chain.
          video = Path("airplay-src/app/src/main/kotlin/io/github/jqssun/airplay/renderer/VideoRenderer.kt")
          content = video.read_text(encoding="utf-8")
          old_drop = "        droppedFrames++\\n        Log.w(TAG, \"Decoder input queue full; dropping frame. drops=$droppedFrames\")\\n"
          new_drop = "        droppedFrames++\\n        Log.w(TAG, \"Decoder input queue full; dropping frame and waiting for keyframe. drops=$droppedFrames\")\\n        stopCodec()\\n"
          if old_drop not in content:
              raise SystemExit("Could not find expected VideoRenderer input-drop block")
          video.write_text(content.replace(old_drop, new_drop, 1), encoding="utf-8")

          # SPS/PPS parameter sets are not random-access frames. Restart only
          # on an actual AVC IDR or HEVC IRAP frame.
          content = video.read_text(encoding="utf-8")
          content = content.replace("type == 5 || type == 7", "type == 5")
          content = content.replace("type == 19 || type == 20 || type == 21 || type == 32 || type == 33", "type == 19 || type == 20 || type == 21")
          video.write_text(content, encoding="utf-8")

          gradle = Path("airplay-src/app/build.gradle.kts")
          content = gradle.read_text(encoding="utf-8")
          if "compileSdk = 37" not in content or "targetSdk = 37" not in content:
              raise SystemExit("Could not find expected SDK versions in app/build.gradle.kts")
          content = content.replace("compileSdk = 37", "compileSdk = 36")
          content = content.replace("targetSdk = 37", "targetSdk = 36")
          gradle.write_text(content, encoding="utf-8")

          # Android 37 permission constants are not present in the available API 36 SDK.
          # Use their stable platform values while retaining the API 37 runtime check.
          main = Path("airplay-src/app/src/main/kotlin/io/github/jqssun/airplay/MainActivity.kt")
          content = main.read_text(encoding="utf-8")
          content = content.replace("Build.VERSION_CODES.CINNAMON_BUN", "37")
          content = content.replace("Manifest.permission.ACCESS_LOCAL_NETWORK", '"android.permission.ACCESS_LOCAL_NETWORK"')
          main.write_text(content, encoding="utf-8")

          permissions = Path("airplay-src/app/src/main/kotlin/io/github/jqssun/airplay/Permissions.kt")
          content = permissions.read_text(encoding="utf-8")
          content = content.replace("Build.VERSION_CODES.CINNAMON_BUN", "37")
          content = content.replace("Manifest.permission.ACCESS_LOCAL_NETWORK", '"android.permission.ACCESS_LOCAL_NETWORK"')
          permissions.write_text(content, encoding="utf-8")
          PY

      - name: Build debug APK
        working-directory: airplay-src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LekhaCast-APK
          path: airplay-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
