name: Build Lekha Cast APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branding repository
        uses: actions/checkout@v4

      - name: Checkout AirPlay receiver source
        uses: actions/checkout@v4
        with:
          repository: jqssun/android-airplay-server
          ref: main
          path: airplay-src
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-37" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Apply Lekha Cast branding
        run: |
          python3 - <<'PY'
          from pathlib import Path

          strings = Path("airplay-src/app/src/main/res/values/strings.xml")
          content = strings.read_text(encoding="utf-8")
          if "AirPlay Server" not in content:
              raise SystemExit("Could not find expected app name in strings.xml")
          strings.write_text(content.replace("AirPlay Server", "Лёха Cast"), encoding="utf-8")

          prefs = Path("airplay-src/app/src/main/kotlin/io/github/jqssun/airplay/Prefs.kt")
          content = prefs.read_text(encoding="utf-8")
          if '"Android AirPlay"' not in content:
              raise SystemExit("Could not find expected default receiver name in Prefs.kt")
          prefs.write_text(content.replace('"Android AirPlay"', '"Лёха TV"'), encoding="utf-8")
          PY

      - name: Build debug APK
        working-directory: airplay-src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LekhaCast-APK
          path: airplay-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
